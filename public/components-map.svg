<text x="796" y="904" text-anchor="middle" font-size="13" fill="#475569">Every AI step uses Gemini Flash (gemini-3.6-flash → gemini-3-flash-preview → gemini-3.5-flash-lite fallback). Numbers come from code, words from the AI.</text>
<text x="796" y="925" text-anchor="middle" font-size="13" fill="#475569">If Gemini is unavailable, a keyword-only brief still ships, marked partial. If a source fails, the others carry on and the brief names it.</text>
